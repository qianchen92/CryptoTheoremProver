name = "Crypto"
version = "0.1.0"
keywords = ["cryptography", "formal-verification", "lean"]
defaultTargets = ["Crypto", "CryptoFirstOrder", "CryptoConstruction", "CryptoTest"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0-rc1"

[[lean_lib]]
name = "Crypto"

[[lean_lib]]
name = "CryptoFirstOrder"

[[lean_lib]]
name = "CryptoConstruction"

[[lean_lib]]
name = "CryptoTest"
